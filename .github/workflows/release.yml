# Releases come only from CI: push a signed tag vX.Y.Z and this workflow tests, builds,
# attests and publishes to PyPI with trusted publishing (no API tokens anywhere).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import repo_guard; print(repo_guard.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Test
        run: python -m unittest
      - name: Build sdist, wheel and zipapp
        run: |
          python -m pip install --upgrade build
          python -m build
          python -I scripts/build_pyz.py "dist/repo-guard-${GITHUB_REF_NAME#v}.pyz" "/usr/bin/env python3"
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/git-repo-guard/
    permissions:
      id-token: write        # trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the Python distributions
        run: rm -f dist/*.pyz dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify: gh attestation verify <file> --repo $REPO"
          echo "Homebrew: update url/sha256 in Formula/repo-guard.rb in the tap with:"
          grep 'tar.gz' dist/SHA256SUMS
