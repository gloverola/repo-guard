name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.8 is no longer on every runner image; uv provides it everywhere.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python
        id: py
        shell: bash
        run: |
          uv python install ${{ matrix.python }}
          echo "python=$(uv python find ${{ matrix.python }})" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ${{ steps.py.outputs.python }} -m unittest -v
      - name: Selftest (zipapp, as install.sh builds it)
        shell: bash
        run: |
          "${{ steps.py.outputs.python }}" -I scripts/build_pyz.py "$RUNNER_TEMP/repo-guard.pyz"
          "${{ steps.py.outputs.python }}" -I "$RUNNER_TEMP/repo-guard.pyz" selftest
      - name: repo-guard scans itself clean
        shell: bash
        run: |
          "${{ steps.py.outputs.python }}" -I "$RUNNER_TEMP/repo-guard.pyz" scan . --fail-on medium
          # the exit code must survive the zipapp: an infected repo must fail
          "${{ steps.py.outputs.python }}" -I "$RUNNER_TEMP/repo-guard.pyz" scan /nonexistent && exit 1 || [ $? = 2 ]

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel, install, run
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/repo-guard --version
          /tmp/venv/bin/repo-guard selftest
          ! /tmp/venv/bin/pip show git-repo-guard | grep -E '^Requires: .+'

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          touch ~/.bashrc
          ./install.sh
          ~/.local/bin/repo-guard --version
          grep -q '>>> repo-guard >>>' ~/.bashrc
          ./install.sh --uninstall
          ! grep -q '>>> repo-guard >>>' ~/.bashrc
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\repo-guard\repo-guard.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./install.ps1 -Uninstall
